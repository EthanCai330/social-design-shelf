name: Deploy showcase to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 上传 artifact 和部署必须在**不同的 job**，否则 deploy-pages 找不到 artifact
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r showcase/* _site/
          mkdir -p _site/components
          cp components/*.md _site/components/ 2>/dev/null || true
          cp INDEX.md _site/ 2>/dev/null || true
          echo "site files: $(find _site -type f | wc -l)"
          find _site -maxdepth 1 -type f

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
